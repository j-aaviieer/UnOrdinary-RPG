<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b111b">
  <base href="/UnOrdinary-RPG/">
  <title>UnOrdinary-RPG | Wellston</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css?v=6">
</head>
<body>
  <main id="gameScreen">
    <div id="game"></div>
    <section class="rpg-hud player-hud" aria-label="Estado del jugador"><div class="hud-portrait"><img src="static/img/player.svg" alt="Jugador"></div><div class="hud-info"><div class="hud-name"><strong>AVENTURERO</strong><span id="playerLevel">Nv. 1</span></div><div class="hud-meter"><span>HP</span><div class="meter-track"><i id="hpFill"></i></div><b id="hpText">100/100</b></div><div class="hud-meter aura-meter"><span>AURA</span><div class="meter-track"><i id="auraFill"></i></div><b id="auraText">60/60</b></div></div></section>
    <section class="rpg-hud skill-hud" aria-label="Habilidad del jugador"><div class="skill-gem">✦</div><div class="skill-info"><small>HABILIDAD</small><strong id="hudSkillName">Sin descubrir</strong><span id="hudSkillLevel">Nivel 1.0</span></div><kbd>K</kbd></section>
    <nav class="quick-menu" aria-label="Menú del jugador">
      <button class="quick-button" data-panel="inventory"><kbd>I</kbd><span>Inventario</span></button>
      <button class="quick-button" data-panel="ability"><kbd>K</kbd><span>Habilidad</span></button>
      <button class="quick-button" data-panel="missions"><kbd>J</kbd><span>Misiones</span></button>
      <button class="quick-button" data-panel="phone"><kbd>M</kbd><span>Teléfono</span></button>
    </nav>
    <div class="world-hint" id="interactionHint">WASD · Mover <span> E · Interactuar</span></div>
    <div class="toast" id="toast"></div>
  </main>
  <div id="modalBackdrop" class="backdrop hidden">
    <section class="modal" role="dialog" aria-modal="true">
      <button id="modalClose" class="close" aria-label="Cerrar">×</button>
      <div id="modalKicker" class="kicker">WELLSTON</div>
      <h2 id="modalTitle">Inventario</h2>
      <div id="modalBody"></div>
      <div id="modalActions" class="actions"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="static/js/main.js?v=6"></script>
</body>
</html>
